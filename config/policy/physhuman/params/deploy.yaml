policy_precision: "fp32"  # "int8" or "fp16" or "fp32" [only useful for tensorRT deployment]
policy_runner: "onnx"  # "onnx" or "onnx_stateful"
policy_file: "policy.onnx"
text_embedding_dict_path: "config/policy/physhuman/params/text_embedding_dict.npz"

soft_gate:
  enabled: false
  active_signals: ["projected_gravity", "root_velocity"]
  threshold: 0.2
  sharpness: 10.0
  gate_floor: 0.2
  initial_gate: 0.2
  ema_enabled: true
  ema_alpha: 0.9
  ema_target: "risk"
  projected_gravity_weight: 3.0
  root_velocity_weight: 0.0

stateful_debug:
  enabled: true
  interval: 20
  preview_dims: 3

step_dt: 0.02
action_monitor:
  decimation: 1
  csv_log:
    enabled: true
    path: "log/policy_actions.csv"
  topic_pub:
    enabled: true
    topic: "/policy_action"
    queue_size: 10
